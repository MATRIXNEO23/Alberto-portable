name: Alberto Portable CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'alberto-portable/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate ledgers
        run: python tools/alberto_portable.py validate
      - name: Run tests
        run: python -m unittest -v tests/test_alberto_portable.py
