name: Alberto Portable CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'alberto-portable/**'
      - 'feature/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate ledgers and recovery sources
        run: python tools/validate_repository.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
